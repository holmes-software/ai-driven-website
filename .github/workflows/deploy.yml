name: Build and deploy

# Build the image in ACR and roll out a new revision to Azure Container Apps
# whenever main moves. Authenticates to Azure via OIDC — no long-lived
# secrets stored in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for azure/login OIDC

env:
  IMAGE_NAME: ai-driven-website

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ACR builds the image server-side and tags it with both the commit SHA
      # (immutable, used by the ACA update) and `latest` (convenience).
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${IMAGE_NAME}:${{ github.sha }}" \
            --image "${IMAGE_NAME}:latest" \
            --file Dockerfile \
            .

      - name: Deploy new revision to Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.ACA_NAME }}" \
            --resource-group "${{ vars.ACA_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
